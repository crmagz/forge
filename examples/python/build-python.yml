# Example: consumer workflow that calls Forge's Python build pipeline.
# Place in .github/workflows/ of your repo.
#
# Prerequisites for GHCR:
#   - GitHub Actions packages: write permission
#   - pyproject.toml with a version field
#   - uv for dependency management (uv.lock)
#   - ruff, mypy, pytest as dev dependencies

name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build:
    uses: crmagz/forge/.github/workflows/build-python.yml@releases/v1
    with:
      environment: dev
      python-version: "3.12"
      container-registry: ghcr
      ghcr-repository: my-org/my-python-app
      platforms: "linux/arm64"
