# Example: consumer workflow that calls Forge's Java build pipeline.
# Place in .github/workflows/ of your repo.
#
# Prerequisites for GHCR:
#   - GitHub Actions packages: write permission
#   - Gradle wrapper (./gradlew) committed to repo
#   - gradle.properties with a version field

name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build:
    uses: crmagz/forge/.github/workflows/build-java.yml@releases/v1
    with:
      environment: dev
      java-version: "21"
      java-distribution: temurin
      container-registry: ghcr
      ghcr-repository: my-org/my-java-app
      platforms: "linux/arm64"
