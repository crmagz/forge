# Example: consumer workflow that calls Forge's Node.js build pipeline.
# Place in .github/workflows/ of your repo.
#
# Prerequisites for GHCR:
#   - GitHub Actions packages: write permission
#   - package.json with build, lint, typecheck, and test scripts
#   - package-lock.json for deterministic installs

name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build:
    uses: crmagz/forge/.github/workflows/build-node.yml@releases/v1
    with:
      environment: dev
      node-version: "22"
      container-registry: ghcr
      ghcr-repository: my-org/my-node-app
      platforms: "linux/arm64"
