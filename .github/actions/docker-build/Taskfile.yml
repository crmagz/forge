version: "3"

tasks:
  build-push:
    desc: Build and push a multi-platform Docker image with registry caching
    requires:
      vars: [REGISTRY, REPOSITORY, TAG]
    cmds:
      - |
        image_ref="${REGISTRY}/${REPOSITORY}"
        build_args=()
        if [ -n "${BUILD_ARGS_INPUT:-}" ]; then
          while IFS= read -r arg; do
            [ -n "$arg" ] && build_args+=(--build-arg "$arg")
          done <<< "$BUILD_ARGS_INPUT"
        fi

        cache_args=()
        if [ -n "${CACHE_REGISTRY:-}" ]; then
          cache_args+=(--cache-from "type=registry,ref=${CACHE_REGISTRY}")
          cache_args+=(--cache-to "type=registry,ref=${CACHE_REGISTRY},mode=max")
        fi

        image_tags=(--tag "${image_ref}:${TAG}")
        if [ "${TAG_LATEST:-false}" = "true" ]; then
          image_tags+=(--tag "${image_ref}:latest")
        fi

        docker buildx build \
          --platform "${PLATFORMS:-linux/arm64}" \
          --file "${DOCKERFILE:-Dockerfile}" \
          "${image_tags[@]}" \
          "${build_args[@]}" \
          "${cache_args[@]}" \
          --push \
          "${CONTEXT:-.}"
