name: Docker Build
description: Build and push Docker image with Buildx and registry caching

inputs:
  registry:
    description: "Container registry URL"
    required: true
  repository:
    description: "Image repository name"
    required: true
  tag:
    description: "Primary image tag"
    required: true
  tag-latest:
    description: "Also tag as latest"
    default: "false"
  dockerfile:
    description: "Path to Dockerfile"
    default: "Dockerfile"
  context:
    description: "Docker build context"
    default: "."
  platforms:
    description: "Target platforms"
    default: "linux/arm64"
  build-args:
    description: "Newline-separated build arguments"
    default: ""
  cache-registry:
    description: "Registry ref for buildx cache (e.g., registry/repo:buildcache)"
    default: ""

runs:
  using: composite
  steps:
    - name: Setup QEMU
      uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130

    - name: Setup Buildx
      uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

    - name: Setup Task
      uses: arduino/setup-task@b91d5d2c96a56797b48ac1e0e89220bf64044611
      with:
        version: "3.52.0"

    - name: Build and push
      shell: bash
      env:
        CACHE_REGISTRY: ${{ inputs.cache-registry }}
        CONTEXT: ${{ inputs.context }}
        DOCKERFILE: ${{ inputs.dockerfile }}
        IMAGE_REGISTRY: ${{ inputs.registry }}
        IMAGE_REPOSITORY: ${{ inputs.repository }}
        IMAGE_TAG: ${{ inputs.tag }}
        INPUT_BUILD_ARGS: ${{ inputs.build-args }}
        PLATFORMS: ${{ inputs.platforms }}
        TAG_LATEST: ${{ inputs.tag-latest }}
      run: |
        REGISTRY="$IMAGE_REGISTRY" \
          REPOSITORY="$IMAGE_REPOSITORY" \
          TAG="$IMAGE_TAG" \
          BUILD_ARGS_INPUT="$INPUT_BUILD_ARGS" \
          CACHE_REGISTRY="$CACHE_REGISTRY" \
          CONTEXT="$CONTEXT" \
          DOCKERFILE="$DOCKERFILE" \
          PLATFORMS="$PLATFORMS" \
          TAG_LATEST="$TAG_LATEST" \
          task --dir "$GITHUB_WORKSPACE" --taskfile "$GITHUB_ACTION_PATH/Taskfile.yml" build-push
