version: "3"

vars:
  DOCKERFILE: '{{.DOCKERFILE | default "Dockerfile"}}'
  CONTEXT: '{{.CONTEXT | default "."}}'
  PLATFORMS: '{{.PLATFORMS | default "linux/arm64"}}'
  REGISTRY: '{{.REGISTRY | default ""}}'
  REPOSITORY: '{{.REPOSITORY}}'
  TAG: '{{.TAG}}'
  CACHE_REGISTRY: '{{.CACHE_REGISTRY | default ""}}'
  BUILD_ARGS: '{{.BUILD_ARGS | default ""}}'
  TAG_LATEST: '{{.TAG_LATEST | default "false"}}'

tasks:
  build-push:
    desc: Build and push Docker image with Buildx and registry caching
    requires:
      vars: [REGISTRY, REPOSITORY, TAG]
    env:
      REGISTRY: '{{.REGISTRY}}'
      REPOSITORY: '{{.REPOSITORY}}'
      TAG: '{{.TAG}}'
      BUILD_ARGS_INPUT: '{{.BUILD_ARGS}}'
      CACHE_REGISTRY: '{{.CACHE_REGISTRY}}'
      CONTEXT: '{{.CONTEXT}}'
      DOCKERFILE: '{{.DOCKERFILE}}'
      PLATFORMS: '{{.PLATFORMS}}'
      TAG_LATEST: '{{.TAG_LATEST}}'
    cmds:
      - task --dir {{.ROOT_DIR}} --taskfile {{.ROOT_DIR}}/.github/actions/docker-build/Taskfile.yml build-push

  build-local:
    desc: Build Docker image locally (no push)
    requires:
      vars: [REPOSITORY, TAG]
    cmds:
      - |
        build_args=""
        if [ -n "{{.BUILD_ARGS}}" ]; then
          while IFS= read -r arg; do
            [ -n "$arg" ] && build_args="$build_args --build-arg $arg"
          done <<< "{{.BUILD_ARGS}}"
        fi

        docker build \
          --file {{.DOCKERFILE}} \
          --tag {{.REPOSITORY}}:{{.TAG}} \
          $build_args \
          {{.CONTEXT}}
